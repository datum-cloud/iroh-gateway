name: Publish Docker Image

on:
  pull_request:
  push:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  publish:
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.24.0
    with:
      image-name: iroh-gateway
    secrets: inherit
